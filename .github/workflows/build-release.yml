name: Build Release

# Manually triggered: build web/cli binaries for each platform, zip them,
# and publish to a GitHub Release.
#
# Workflow (bypasses actions/upload-artifact storage quota):
#   1. prepare job computes the tag (default vYYYYMMDD-<shortSHA>) and creates the release
#   2. each build job builds and packages, then uploads the asset directly via gh release upload
#   3. actions/upload-artifact and download-artifact are intentionally not used
#
# Artifacts:
#   clianywhere-setup.exe          (Windows GUI installer, NSIS, per-user install)
#   CLIAnywhere-macos.dmg              (macOS universal Intel+Apple Silicon, signed + notarized)
#   claw-linux-desktop-amd64.zip (Linux web)
#   claw-linux-cli-amd64.zip     (Linux CLI)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0). Leave empty to use vYYYYMMDD-<shortSHA>."
        required: false
        default: ""
      prerelease:
        description: "Mark as prerelease"
        required: false
        default: "true"
      notes:
        description: "Release notes (optional)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute tag
        id: tag
        run: |
          # Single source of truth: cmd/claw/version.go
          VER="$(sed -n 's/^var Version = "\(.*\)"$/\1/p' cmd/claw/version.go)"
          if [ -z "$VER" ]; then
            echo "Failed to parse Version from cmd/claw/version.go" >&2
            exit 1
          fi
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${VER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          tag="${{ steps.tag.outputs.tag }}"
          prerelease="${{ github.event.inputs.prerelease }}"
          notes_file="$(mktemp)"
          if [ -n "${{ github.event.inputs.notes }}" ]; then
            printf '%s\n' "${{ github.event.inputs.notes }}" > "$notes_file"
          else
            printf 'Auto-built release for %s\n\n' "$tag" > "$notes_file"
            printf 'SHA: %s\n' "${{ github.sha }}" >> "$notes_file"
          fi

          if gh release view "$tag" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $tag already exists, will append assets."
          else
            args=(create "$tag" -R "${{ github.repository }}" --title "$tag" --notes-file "$notes_file")
            if [ "$prerelease" = "true" ]; then
              args+=(--prerelease)
            else
              args+=(--latest=false)
            fi
            gh release "${args[@]}"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: web-windows-amd64
            goos: windows
            goarch: amd64
            tags: web
            bin: claw.exe
            ldflags: "-H windowsgui"
            archive: claw-windows.zip # unused for windows (NSIS installer is built instead)
          - target: web-darwin-amd64
            goos: darwin
            goarch: amd64
            tags: web
            bin: claw
            ldflags: ""
            archive: claw-macos-amd64.zip
          - target: web-darwin-arm64
            goos: darwin
            goarch: arm64
            tags: web
            bin: claw
            ldflags: ""
            archive: claw-macos-arm64.zip
          - target: web-linux-amd64
            goos: linux
            goarch: amd64
            tags: web
            bin: claw
            ldflags: ""
            archive: claw-linux-desktop-amd64.zip
          - target: cli-linux-amd64
            goos: linux
            goarch: amd64
            tags: cli
            bin: claw
            ldflags: ""
            archive: claw-linux-cli-amd64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -e
          echo "Building ${{ matrix.target }} (${GOOS}/${GOARCH}, tags=${{ matrix.tags }})"
          if [ -n "${{ matrix.ldflags }}" ]; then
            go build -tags '${{ matrix.tags }}' -ldflags '${{ matrix.ldflags }}' -o '${{ matrix.bin }}' ./cmd/claw
          else
            go build -tags '${{ matrix.tags }}' -o '${{ matrix.bin }}' ./cmd/claw
          fi
          file '${{ matrix.bin }}' || true

      - name: Package
        id: package
        run: |
          set -e
          if [ "${{ matrix.goos }}" = "windows" ]; then
            # Build NSIS installer (per-user, installs to %USERPROFILE%\.clianywhere)
            sudo apt-get update -qq
            sudo apt-get install -y -qq nsis
            # Installer version comes from cmd/claw/version.go (same as `claw version`)
            VER="$(sed -n 's/^var Version = "\(.*\)"$/\1/p' cmd/claw/version.go)"
            makensis -NOCD -DVERSION="$VER" packaging/windows/installer.nsi
            asset="clianywhere-setup.exe"
          else
            # Pack only the binary; do not include sources or other files.
            zip '${{ matrix.archive }}' '${{ matrix.bin }}'
            asset="${{ matrix.archive }}"
          fi
          ls -lh "$asset"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Upload asset to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release upload "${{ needs.prepare.outputs.tag }}" \
            "${{ steps.package.outputs.asset }}" \
            -R "${{ github.repository }}" --clobber

  sign-macos:
    name: Sign & Notarize macOS
    needs: [prepare, build]
    runs-on: macos-latest
    env:
      KEY_ID: A9F8T72LN2
      ISSUER_ID: a4618400-70ac-4174-abc0-ee906b3abda2
      TEAM_ID: 589W76M4Z8
      CERT_CN: "Developer ID Application: JUN HU (589W76M4Z8)"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and extract macOS artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          tag="${{ needs.prepare.outputs.tag }}"
          gh release download "$tag" \
            -R "${{ github.repository }}" \
            -D /tmp/archives \
            -p "claw-macos-amd64.zip"
          gh release download "$tag" \
            -R "${{ github.repository }}" \
            -D /tmp/archives \
            -p "claw-macos-arm64.zip"
          # Extract each arch into its own dir so same-named claw does not overwrite
          mkdir -p /tmp/release/amd64 /tmp/release/arm64
          unzip -o /tmp/archives/claw-macos-amd64.zip -d /tmp/release/amd64
          unzip -o /tmp/archives/claw-macos-arm64.zip -d /tmp/release/arm64
          ls -lh /tmp/release/amd64/claw /tmp/release/arm64/claw

      - name: Build AppIcon.icns
        run: |
          set -e
          ICONSET=/tmp/AppIcon.iconset
          rm -rf "$ICONSET"
          mkdir -p "$ICONSET"
          # Use sips to generate each size from the 1024 source image
          for s in 16 32 128 256 512; do
            sips -z $s $s "${{ github.workspace }}/packaging/macos/app_icon_1024.png" --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            d=$((s*2))
            sips -z $d $d "${{ github.workspace }}/packaging/macos/app_icon_1024.png" --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          # Generate 1024 separately as the @2x of 512
          sips -z 1024 1024 "${{ github.workspace }}/packaging/macos/app_icon_1024.png" --out "$ICONSET/icon_512x512@2x.png" >/dev/null
          iconutil -c icns "$ICONSET" -o /tmp/AppIcon.icns
          ls -lh /tmp/AppIcon.icns

      - name: Decode p12 certificate
        env:
          APPLE_P12_B64: ${{ secrets.APPLE_P12 }}
        run: |
          echo "$APPLE_P12_B64" | base64 -d > /tmp/claw.p12
          ls -lh /tmp/claw.p12

      - name: Import certificate into keychain
        env:
          P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Set as default so codesign can find it without full path
          security default-keychain -s "$KEYCHAIN_PATH"
          security import /tmp/claw.p12 \
            -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -A \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Add to system keychain search list
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          echo "--- Available identities ---"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Merge universal binary
        run: |
          set -e
          mkdir -p /tmp/release/universal
          lipo -create \
            /tmp/release/amd64/claw \
            /tmp/release/arm64/claw \
            -output /tmp/release/universal/claw
          file /tmp/release/universal/claw

      - name: Sign, notarize and staple CLIAnywhere-macos.dmg
        env:
          APPLE_P8: ${{ secrets.APPLE_P8 }}
        run: |
          set -e
          echo "$APPLE_P8" > /tmp/key.p8
          tag="${{ needs.prepare.outputs.tag }}"
          VER="${tag#v}"
          cd /tmp/release/universal
          # Assemble .app bundle (universal binary)
          mkdir -p "CLIAnywhere.app/Contents/MacOS" "CLIAnywhere.app/Contents/Resources"
          cp claw "CLIAnywhere.app/Contents/MacOS/claw"
          cp "${{ github.workspace }}/packaging/macos/Info.plist" "CLIAnywhere.app/Contents/Info.plist"
          cp /tmp/AppIcon.icns "CLIAnywhere.app/Contents/Resources/AppIcon.icns"
          # macOS builds read the web app zip from Resources (not embedded)
          cp "${{ github.workspace }}/cmd/claw/localattachwebapp.zip" "CLIAnywhere.app/Contents/Resources/localattachwebapp.zip"
          sed -i '' "s/VERSION_PLACEHOLDER/${VER}/g" "CLIAnywhere.app/Contents/Info.plist"
          # Sign .app
          codesign --sign "$CERT_CN" --options runtime --timestamp \
            --force --deep "CLIAnywhere.app"
          codesign -dv --verbose=4 "CLIAnywhere.app"
          # Notarize + staple the .app so a copy extracted from the DMG is
          # verifiable offline too (ticket lives inside the bundle).
          zip -qr /tmp/notarize-app.zip "CLIAnywhere.app"
          xcrun notarytool submit /tmp/notarize-app.zip \
            --key /tmp/key.p8 --key-id "$KEY_ID" \
            --issuer "$ISSUER_ID" --team-id "$TEAM_ID" \
            --wait
          rm -f /tmp/notarize-app.zip
          xcrun stapler staple "CLIAnywhere.app"
          xcrun stapler validate "CLIAnywhere.app"
          # Build DMG with drag-to-Applications layout
          "${{ github.workspace }}/packaging/macos/make-dmg.sh" \
            "CLIAnywhere.app" \
            "CLIAnywhere-macos.dmg"
          # Sign the DMG itself so Gatekeeper/spctl sees a usable signature.
          codesign --sign "$CERT_CN" --options runtime --timestamp "CLIAnywhere-macos.dmg"
          # Notarize the DMG (the distributed artifact)
          xcrun notarytool submit "CLIAnywhere-macos.dmg" \
            --key /tmp/key.p8 --key-id "$KEY_ID" \
            --issuer "$ISSUER_ID" --team-id "$TEAM_ID" \
            --wait
          # Staple the notarization ticket into the DMG
          xcrun stapler staple "CLIAnywhere-macos.dmg"
          xcrun stapler validate "CLIAnywhere-macos.dmg"
          echo "Notarized: CLIAnywhere-macos.dmg (app + dmg)"

      - name: Upload notarized DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          tag="${{ needs.prepare.outputs.tag }}"
          # The raw un-notarized binary zips are superseded by the universal DMG.
          for asset in claw-macos-amd64.zip claw-macos-arm64.zip; do
            gh release delete-asset "$tag" "$asset" \
              -R "${{ github.repository }}" --yes || true
          done
          gh release upload "$tag" \
            /tmp/release/universal/CLIAnywhere-macos.dmg \
            -R "${{ github.repository }}" --clobber
          echo "Uploaded notarized CLIAnywhere-macos.dmg"

  finalize:
    name: Finalize
    needs: [prepare, build, sign-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Show Release URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ needs.prepare.outputs.tag }}" -R "${{ github.repository }}" --json url -q .url
