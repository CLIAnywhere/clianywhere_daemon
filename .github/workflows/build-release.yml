name: Build Release

# Manually triggered: build web/cli binaries for each platform, zip them,
# and publish to a GitHub Release.
#
# Workflow (bypasses actions/upload-artifact storage quota):
#   1. prepare job computes the tag (default vYYYYMMDD-<shortSHA>) and creates the release
#   2. each build job builds and packages, then uploads the asset directly via gh release upload
#   3. actions/upload-artifact and download-artifact are intentionally not used
#
# Artifacts:
#   claw-windows.zip             (Windows GUI, -H windowsgui)
#   claw-macos-amd64.zip         (macOS Intel)
#   claw-macos-arm64.zip         (macOS Apple Silicon)
#   claw-linux-desktop-amd64.zip (Linux web)
#   claw-linux-cli-amd64.zip     (Linux CLI)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0). Leave empty to use vYYYYMMDD-<shortSHA>."
        required: false
        default: ""
      prerelease:
        description: "Mark as prerelease"
        required: false
        default: "true"
      notes:
        description: "Release notes (optional)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            short="$(echo ${{ github.sha }} | cut -c1-7)"
            echo "tag=v$(date +'%Y%m%d')-${short}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          tag="${{ steps.tag.outputs.tag }}"
          prerelease="${{ github.event.inputs.prerelease }}"
          notes_file="$(mktemp)"
          if [ -n "${{ github.event.inputs.notes }}" ]; then
            printf '%s\n' "${{ github.event.inputs.notes }}" > "$notes_file"
          else
            printf 'Auto-built release for %s\n\n' "$tag" > "$notes_file"
            printf 'SHA: %s\n' "${{ github.sha }}" >> "$notes_file"
          fi

          if gh release view "$tag" -R "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $tag already exists, will append assets."
          else
            args=(create "$tag" -R "${{ github.repository }}" --title "$tag" --notes-file "$notes_file")
            if [ "$prerelease" = "true" ]; then
              args+=(--prerelease)
            else
              args+=(--latest=false)
            fi
            gh release "${args[@]}"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: web-windows-amd64
            goos: windows
            goarch: amd64
            tags: web
            bin: claw.exe
            ldflags: "-H windowsgui"
            archive: claw-windows.zip
          - target: web-darwin-amd64
            goos: darwin
            goarch: amd64
            tags: web
            bin: claw
            ldflags: ""
            archive: claw-macos-amd64.zip
          - target: web-darwin-arm64
            goos: darwin
            goarch: arm64
            tags: web
            bin: claw
            ldflags: ""
            archive: claw-macos-arm64.zip
          - target: web-linux-amd64
            goos: linux
            goarch: amd64
            tags: web
            bin: claw
            ldflags: ""
            archive: claw-linux-desktop-amd64.zip
          - target: cli-linux-amd64
            goos: linux
            goarch: amd64
            tags: cli
            bin: claw
            ldflags: ""
            archive: claw-linux-cli-amd64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -e
          echo "Building ${{ matrix.target }} (${GOOS}/${GOARCH}, tags=${{ matrix.tags }})"
          if [ -n "${{ matrix.ldflags }}" ]; then
            go build -tags '${{ matrix.tags }}' -ldflags '${{ matrix.ldflags }}' -o '${{ matrix.bin }}' ./cmd/claw
          else
            go build -tags '${{ matrix.tags }}' -o '${{ matrix.bin }}' ./cmd/claw
          fi
          file '${{ matrix.bin }}' || true

      - name: Package
        run: |
          set -e
          # Pack only the binary; do not include sources or other files.
          zip '${{ matrix.archive }}' '${{ matrix.bin }}'
          ls -lh '${{ matrix.archive }}'

      - name: Upload asset to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release upload "${{ needs.prepare.outputs.tag }}" \
            '${{ matrix.archive }}' \
            -R "${{ github.repository }}" --clobber

  sign-macos:
    name: Sign & Notarize macOS
    needs: [prepare, build]
    runs-on: macos-latest
    env:
      KEY_ID: A9F8T72LN2
      ISSUER_ID: a4618400-70ac-4174-abc0-ee906b3abda2
      TEAM_ID: 589W76M4Z8
      CERT_CN: "Developer ID Application: JUN HU (589W76M4Z8)"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download macOS artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.prepare.outputs.tag }}"
          gh release download "$tag" \
            -R "${{ github.repository }}" \
            -D /tmp/release \
            -p "claw-macos-amd64.zip"
          gh release download "$tag" \
            -R "${{ github.repository }}" \
            -D /tmp/release \
            -p "claw-macos-arm64.zip"
          ls -lh /tmp/release/

      - name: Extract zipped binaries
        run: |
          cd /tmp/release
          unzip -o claw-macos-amd64.zip
          unzip -o claw-macos-arm64.zip
          ls -lh claw
          file claw

      - name: Decode p12 certificate
        env:
          APPLE_P12_B64: ${{ secrets.APPLE_P12 }}
        run: |
          echo "$APPLE_P12_B64" | base64 -d > /tmp/claw.p12
          ls -lh /tmp/claw.p12

      - name: Import certificate into keychain
        env:
          P12_PASSWORD: 123123
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Set as default so codesign can find it without full path
          security default-keychain -s "$KEYCHAIN_PATH"
          security import /tmp/claw.p12 \
            -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -A \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # Add to system keychain search list
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          echo "--- Available identities ---"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Sign and notarize claw (amd64)
        env:
          APPLE_P8: ${{ secrets.APPLE_P8 }}
        run: |
          set -e
          echo "$APPLE_P8" > /tmp/key.p8
          cd /tmp/release
          cp claw claw-macos-amd64
          codesign --sign "$CERT_CN" --options runtime --timestamp claw-macos-amd64
          codesign -dv claw-macos-amd64
          zip notarize-amd64.zip claw-macos-amd64
          xcrun notarytool submit notarize-amd64.zip \
            --key /tmp/key.p8 --key-id "$KEY_ID" \
            --issuer "$ISSUER_ID" --team-id "$TEAM_ID" \
            --wait
          rm -f notarize-amd64.zip
          echo "Notarized: claw-macos-amd64"

      - name: Sign and notarize claw (arm64)
        env:
          APPLE_P8: ${{ secrets.APPLE_P8 }}
        run: |
          set -e
          echo "$APPLE_P8" > /tmp/key.p8
          cd /tmp/release
          cp claw claw-macos-arm64
          codesign --sign "$CERT_CN" --options runtime --timestamp claw-macos-arm64
          codesign -dv claw-macos-arm64
          zip notarize-arm64.zip claw-macos-arm64
          xcrun notarytool submit notarize-arm64.zip \
            --key /tmp/key.p8 --key-id "$KEY_ID" \
            --issuer "$ISSUER_ID" --team-id "$TEAM_ID" \
            --wait
          rm -f notarize-arm64.zip
          echo "Notarized: claw-macos-arm64"

      - name: Re-package and upload notarized binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          tag="${{ needs.prepare.outputs.tag }}"
          cd /tmp/release
          zip claw-macos-amd64.zip claw-macos-amd64
          zip claw-macos-arm64.zip claw-macos-arm64
          gh release upload "$tag" claw-macos-amd64.zip claw-macos-arm64.zip \
            -R "${{ github.repository }}" --clobber
          echo "Uploaded notarized macOS binaries"

  finalize:
    name: Finalize
    needs: [prepare, build, sign-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Show Release URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ needs.prepare.outputs.tag }}" -R "${{ github.repository }}" --json url -q .url
